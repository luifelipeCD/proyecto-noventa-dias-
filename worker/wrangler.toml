# Configuración del Cloudflare Worker que genera recetas con IA.
# Deploy:  npm run worker:deploy      (ver README-worker.md)

name = "recetario-ia"
main = "index.js"
compatibility_date = "2025-09-01"

# --- LÍMITE DE USO ---
# Contador de generaciones por IP (máx. 5 cada 24 h). El id es el del
# namespace de KV "RATE_LIMIT" ya creado en Cloudflare.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b0ab7c59a9f7443b80ea5066c6e1a623"

# --- BASE DE DATOS (usuarios, sesión de magic-link, estado de Stripe) ---
# Creada con `npx wrangler d1 create recetario-ia-db`. Aplica el schema con:
#   npx wrangler d1 execute recetario-ia-db --local  --file=worker/schema.sql   (dev)
#   npx wrangler d1 execute recetario-ia-db --remote --file=worker/schema.sql   (producción, una sola vez)
[[d1_databases]]
binding = "DB"
database_name = "recetario-ia-db"
database_id = "e1fb6282-6a08-4744-bc6d-2e4a59f32c3b"

# --- API KEY ---
# La clave de Anthropic NO se pone aquí. Se guarda cifrada como "secret":
#   npm run worker:secret
#   (equivale a: npx wrangler secret put ANTHROPIC_API_KEY --config worker/wrangler.toml)

# --- AUTENTICACIÓN POR MAGIC LINK ---
# SESSION_SECRET (secret, obligatorio): clave para firmar el token de sesión (HMAC-SHA256).
#   npx wrangler secret put SESSION_SECRET --config worker/wrangler.toml
# RESEND_API_KEY (secret, opcional en local): API key de https://resend.com para enviar el
#   correo con el link. Sin ella, el Worker NO envía el correo pero sigue funcionando en local:
#   registra el link en los logs (`wrangler tail`) para poder probarlo a mano.
#   npx wrangler secret put RESEND_API_KEY --config worker/wrangler.toml
# RESEND_FROM (var, opcional): remitente del correo. Por defecto usa el dominio de pruebas
# de Resend (onboarding@resend.dev), que solo entrega a la cuenta dueña de la API key —
# para mandar a cualquier usuario hace falta verificar un dominio propio en Resend.
# [vars]
# RESEND_FROM = "Transforma tu Cuerpo <hola@tudominio.com>"

# --- CORS (opcional) ---
# El Worker ya permite por defecto tu GitHub Pages (luifelipecd.github.io) y localhost.
# Si sirves el sitio desde otro dominio, añádelo aquí (separados por coma):
# [vars]
# ALLOWED_ORIGIN = "https://midominio.com,https://www.midominio.com"
